services:
  plex_shuffle:
    image: ghcr.io/salilkansal/proper-plex-shuffle:latest
    container_name: plex_shuffle
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - ./plex_config.ini:/app/plex_config.ini
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
