services:
  plex_shuffle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plex_shuffle
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - ./plex_config.ini:/app/plex_config.ini
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
